name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Line-coverage floor (percent) for DAORework.Core + DAORework.Application.
  # ENGINEERING_STANDARDS §5 sets the target at 80. The floor is a ratchet: it
  # starts at the measured baseline and is raised, never lowered. Reached 80 in P0-07.
  COVERAGE_FLOOR: 80
  # The App tests render every page headlessly and save PNGs here, inside the uploaded TestResults folder.
  DAOREWORK_SCREENSHOT_DIR: ${{ github.workspace }}/TestResults/screenshots
  SONAR_ORGANIZATION: arastella625
  SONAR_PROJECT_KEY: arastella625_DAORework

jobs:
  build:
    name: Format, build, test, gates
    runs-on: ubuntu-latest
    env:
      # Fork PRs get no secrets, so Sonar is skipped there instead of failing the build.
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs full history for blame and new-code detection

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DAORework.sln

      - name: Format check
        run: dotnet format DAORework.sln --no-restore --verify-no-changes

      - name: Install SonarScanner for .NET
        if: env.SONAR_ENABLED == 'true'
        run: dotnet tool install --global dotnet-sonarscanner --version 12.0.0

      # Roslyn's own findings aren't imported (P2.5-37, #60): warnings already fail the build, so the only ones left
      # are the style suggestions .editorconfig keeps as suggestions on purpose.
      # Two Sonar rules are wrong for one file each (P2.5-38, #61):
      # - S1244 in LookColor: RGB to HSL compares max == r and max == g exactly, and max is always exactly one of them.
      # - S2245 in GrainTexture: the seeded Random draws the background grain, not a secret, and the seed keeps the
      #   headless screenshots the same between runs.
      - name: Sonar begin
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /o:"$SONAR_ORGANIZATION" /k:"$SONAR_PROJECT_KEY"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.cs.roslyn.ignoreIssues=true
          /d:sonar.issue.ignore.multicriteria=e1,e2
          /d:sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S1244
          /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/Looks/LookColor.cs"
          /d:sonar.issue.ignore.multicriteria.e2.ruleKey=csharpsquid:S2245
          /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/Themes/GrainTexture.cs"

      - name: Build (warnings are errors)
        run: dotnet build DAORework.sln --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test DAORework.sln --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover

      - name: Sonar end
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Coverage gate
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -ResultsDirectory TestResults -Floor $env:COVERAGE_FLOOR

      - name: File-size gate
        shell: pwsh
        run: ./scripts/check-file-size.ps1

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  windows-tests:
    # The build job runs on Linux, where Windows-only failures stay hidden (P2.6-02).
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test DAORework.sln --configuration Release
