name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Line-coverage floor (percent) for DAORework.Core + DAORework.Application.
  # ENGINEERING_STANDARDS §5 sets the target at 80. The floor is a ratchet: it
  # starts at the measured baseline and is raised, never lowered. Reached 80 in P0-07.
  COVERAGE_FLOOR: 80
  # The App tests render every page headlessly and save PNGs here, inside the uploaded TestResults folder.
  DAOREWORK_SCREENSHOT_DIR: ${{ github.workspace }}/TestResults/screenshots
  SONAR_ORGANIZATION: arastella625
  SONAR_PROJECT_KEY: arastella625_DAORework

jobs:
  build:
    name: Format, build, test, gates
    runs-on: ubuntu-latest
    env:
      # Fork PRs get no secrets, so Sonar is skipped there instead of failing the build.
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar needs full history for blame and new-code detection

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DAORework.sln

      - name: Format check
        run: dotnet format DAORework.sln --no-restore --verify-no-changes

      - name: Install SonarScanner for .NET
        if: env.SONAR_ENABLED == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonar begin
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /o:"$SONAR_ORGANIZATION" /k:"$SONAR_PROJECT_KEY"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      - name: Build (warnings are errors)
        run: dotnet build DAORework.sln --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test DAORework.sln --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover

      - name: Sonar end
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Coverage gate
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -ResultsDirectory TestResults -Floor $env:COVERAGE_FLOOR

      - name: File-size gate
        shell: pwsh
        run: ./scripts/check-file-size.ps1

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 14
