name: Bug report
description: Something behaves differently from what the docs or the CLI help say.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `dotnet run --project src/DAORework.Cli -- ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the diagnostic code (DAO_...) and the log excerpt from `%LOCALAPPDATA%\DAORework\logs` if relevant.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Steam install, DAORework commit abc1234"
  - type: markdown
    attributes:
      value: "Never attach game files, saves or mod archives. Paths may contain your Windows username; redact them if you prefer."
